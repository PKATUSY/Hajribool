name: Build Hajiri Book APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub web / mobile app

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Project Directory
        id: dir-check
        run: |
          if [ -d "android" ]; then
            echo "project_dir=android" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.dir-check.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_PATH=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HajiriBook-Debug-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Print Download Instructions
        run: |
          echo "=========================================================="
          echo "APK BUILD COMPLETED SUCCESSFULLY!"
          echo "You can download the APK from the Artifacts section above."
          echo "=========================================================="
